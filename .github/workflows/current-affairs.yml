name: Current affairs refresh

# Twice a month (the 1st and 15th, 06:17 UTC), Claude Code (Sonnet 5.5) reviews every
# country's Current Affairs and Society & Economy questions against the news, rewrites ones
# that are no longer true and proposes a couple of fresh ones per subject. scripts/factcheck/factcheck.mjs screens the
# proposals (schema, same difficulty, no duplicates, at least one source URL), has a separate
# Claude Code session fact-check them, and keeps only changes it passes with high confidence.
# Once the tests pass, this workflow opens a pull request against main, merges it, and starts
# CI on the merged commit so Railway deploys it. Untick "automerge" on a manual run to leave
# the pull request open for review instead.
#
# Runs on your Claude subscription only; no API key is used (the script strips API
# credentials before starting Claude Code). Needs:
#   - repository secret CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token` locally)
#   - Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests"
# Runs count against your subscription's usage limits.
on:
  schedule:
    - cron: '17 6 1,15 * *'
  workflow_dispatch:
    inputs:
      countries:
        description: 'Country ids separated by spaces (blank = all 26)'
        required: false
        default: ''
      fresh:
        description: 'New questions per country (0-5)'
        required: false
        default: '2'
      automerge:
        description: 'Merge the pull request automatically'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: write # to start CI on the merged commit

concurrency:
  group: current-affairs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # the branch Railway deploys; the PR is opened against it
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Refresh questions with Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          COUNTRIES: ${{ inputs.countries }}
          FRESH: ${{ inputs.fresh || '2' }}
        # $COUNTRIES is split on spaces on purpose; the script rejects unknown ids.
        run: node scripts/factcheck/factcheck.mjs refresh $COUNTRIES --fresh "$FRESH" --summary "$RUNNER_TEMP/pr-body.md" --result "$RUNNER_TEMP/refresh-result.json"

      - name: Content and unit tests
        run: npm test

      - name: Open and merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          # Scheduled runs have no inputs, so anything but an explicit "false" means merge.
          AUTOMERGE: ${{ inputs.automerge != false }}
        run: |
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- src/data/questions; then
            echo "No questions changed; nothing to open."
            exit 0
          fi
          branch="content/current-affairs-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/data/questions
          git commit -m "Refresh Current Affairs questions ($(date -u +%Y-%m-%d))"
          git push -u origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "Current Affairs refresh: $(date -u +'%-d %B %Y')" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$AUTOMERGE" != "true" ]; then
            echo "automerge is off; leaving the pull request open for review."
            exit 0
          fi
          gh pr merge "$url" --squash --delete-branch
          echo "Merged $url" | tee -a "$GITHUB_STEP_SUMMARY"
          # Pushes made with the workflow token don't trigger other workflows, so start CI on
          # the merged commit explicitly; Railway deploys main once CI is green.
          gh workflow run ci.yml --ref main

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-affairs-refresh
          path: |
            ${{ runner.temp }}/refresh-result.json
            .factcheck/
          include-hidden-files: true
          if-no-files-found: ignore
