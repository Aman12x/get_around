name: Current affairs refresh (API key)

# The same refresh as current-affairs-subscription.yml, but calling the Claude API directly
# (scripts/factcheck/refresh-current-affairs.mjs, Opus 5.5, billed per token). Manual only;
# to put it on the schedule instead, move the `schedule:` block over from the subscription
# workflow. Needs repository secret ANTHROPIC_API_KEY, and Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'Country ids separated by spaces (blank = all 26)'
        required: false
        default: ''
      fresh:
        description: 'New questions per country (0-5)'
        required: false
        default: '2'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: current-affairs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Refresh questions with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNTRIES: ${{ inputs.countries }}
          FRESH: ${{ inputs.fresh || '2' }}
        # $COUNTRIES is split on spaces on purpose; the script rejects unknown ids.
        run: node scripts/factcheck/refresh-current-affairs.mjs $COUNTRIES --fresh "$FRESH" --summary "$RUNNER_TEMP/pr-body.md" --result "$RUNNER_TEMP/refresh-result.json"

      - name: Content and unit tests
        run: npm test

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- src/data/questions; then
            echo "No questions changed; nothing to open."
            exit 0
          fi
          branch="content/current-affairs-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/data/questions
          git commit -m "Refresh Current Affairs questions ($(date -u +%Y-%m-%d))"
          git push -u origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "Current Affairs refresh: $(date -u +'%-d %B %Y')" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-affairs-refresh
          path: ${{ runner.temp }}/refresh-result.json
          if-no-files-found: ignore
