name: Fact-check eval

# Measures how well the fact-checker (scripts/factcheck/lib.mjs) catches errors, on the
# labelled set in scripts/factcheck/eval/cases.json. Run it by hand from the Actions tab
# after changing the checker's prompt, model or settings; each run spends API credit.
# The summary (recall, precision, specificity) appears on the run page and the full
# results, including transcripts, are attached as an artifact.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Result folder: 'baseline' or v1, v2, ..."
        required: false
        default: baseline
      reps:
        description: 'Repetitions per case'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VARIANT: ${{ inputs.variant }}
          REPS: ${{ inputs.reps }}
        # --approve-harness: this is a fresh checkout reviewed through git, so record its hash.
        run: node scripts/factcheck/eval/run-eval.mjs --variant "$VARIANT" --reps "$REPS" --model claude-opus-5-5 --approve-harness || true
      - name: Summarize
        env:
          VARIANT: ${{ inputs.variant }}
        run: node scripts/factcheck/eval/summarize.mjs --variant "$VARIANT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factcheck-eval-${{ inputs.variant }}
          path: .claude/hillclimb/factcheck/
          include-hidden-files: true
